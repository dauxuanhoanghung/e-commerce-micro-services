<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!--<![endif]-->
    <style type="text/css">
        :root {
            color-scheme: light dark;
        }
    </style>
    <style type="text/css" th:fragment="minify" th:replace="~{fragments/minify :: minify}"></style>
</head>
<body style="text-align: center;margin: 0;padding-top: 10px;padding-bottom:10px; padding-left: 0; padding-right: 0;
        -webkit-text-size-adjust: 100%;background-image: linear-gradient(90deg, rgba(25,112,217,1) 0%, rgba(0,212,255,1) 100%);
        color: #000000; display:flex; justify-content: center; align-items:center;" align="center">
<div style="display:flex;justify-content: center;height: 100%;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse">
        <tbody style="width: 70%;margin: 0 auto;">
        <tr>
            <td style="width:100%;min-width:100%" width="100%">
                <div layout:fragment="header" th:replace="~{fragments/header :: header}"></div>
                <div layout:fragment="content"></div>
                <div layout:fragment="footer" th:replace="~{fragments/footer :: footer}"></div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
