services:
  mail:
    build:
      context: .
      dockerfile: Dockerfile
    image: mail-service
    container_name: mail-service
    ports:
      - "8091:8091"
    networks:
      - mail-service-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"