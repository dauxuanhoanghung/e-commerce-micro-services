spring:
  application:
    name: gateway-service
  config:
    import: "classpath:route-auth.yml"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
  messages:
    basename: messages/messages
    encoding: UTF-8
  profiles:
    active: default

server:
  port: 8080

eureka:
  client:
    healthcheck:
#      enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:Admin%40123@localhost:8761/eureka}
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  logging:
    filter:
      enabled: true
  authentication:
    enabled: true
  jwt:
    secret: 1234567890abcdefghijklmnopqrstuvwxyz

logging:
  file:
    name: logs/gateway-errors.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"