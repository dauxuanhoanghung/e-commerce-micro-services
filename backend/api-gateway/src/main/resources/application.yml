spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

server:
  port: 8080

eureka:
  client:
    healthcheck:
#      enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:Admin%40123@localhost:8761/eureka}
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  logging:
    filter:
      enabled: true
  authentication:
    enabled: true
  jwt:
    secret: 1234567890abcdefghijklmnopqrstuvwxyz
